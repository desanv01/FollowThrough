name: Package reviewed source

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the requested source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build tracked source archive and identity manifest
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/followthrough-package"
          git archive --format=zip --prefix=FollowThrough/ -o "${RUNNER_TEMP}/followthrough-package/FollowThrough-source.zip" HEAD
          git rev-parse HEAD > "${RUNNER_TEMP}/followthrough-package/SOURCE-COMMIT.txt"
          git rev-parse 'HEAD^{tree}' > "${RUNNER_TEMP}/followthrough-package/SOURCE-TREE.txt"
          cd "${RUNNER_TEMP}/followthrough-package"
          sha256sum FollowThrough-source.zip > SHA256SUMS
      - name: Retain source package for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FollowThrough-source-${{ github.sha }}
          path: ${{ runner.temp }}/followthrough-package/
          if-no-files-found: error
          retention-days: 30

