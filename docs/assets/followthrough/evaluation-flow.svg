<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">FollowThrough evaluation architecture</title>
  <desc id="desc">Six task scenarios and two workflow arms supply visible files to separate orchestrator, worker and reviewer histories. A bounded host routes workspace actions to public checks and independent protected grading. Source and requirement identities bind receipts to four separate outcomes.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087c79"/></marker></defs>
  <rect width="1200" height="390" rx="16" fill="#fffdf8"/>
  <g font-family="Arial,sans-serif" fill="#082d3f">
    <text x="42" y="42" font-size="16" font-weight="700" letter-spacing="2">FOLLOWTHROUGH · SOURCE-BOUND EVALUATION</text>
    <g fill="none" stroke="#087c79" stroke-width="2" marker-end="url(#arrow)">
      <path d="M250 172H292"/><path d="M512 172H550"/><path d="M790 126H842"/><path d="M790 218H842"/><path d="M1038 126H1100V290H1010"/><path d="M1038 218H1068V290H1010"/>
    </g>
    <g fill="#fffdf8" stroke="#087c79" stroke-width="1.5">
      <rect x="40" y="100" width="210" height="144" rx="8"/>
      <rect x="292" y="100" width="220" height="144" rx="8"/>
      <rect x="550" y="90" width="240" height="164" rx="8"/>
      <rect x="842" y="88" width="196" height="76" rx="8"/>
      <rect x="842" y="180" width="196" height="76" rx="8"/>
    </g>
    <rect x="550" y="276" width="460" height="72" rx="8" fill="#082d3f"/>
    <g font-size="19" font-weight="700"><text x="60" y="132">Original tasks</text><text x="312" y="132">Separate roles</text><text x="570" y="124">Bounded host</text><text x="859" y="118">Public checks</text><text x="859" y="210">Protected grade</text></g>
    <g font-size="16"><text x="60" y="166">Retry · Preview Cache</text><text x="60" y="193">6 scenarios · 2 arms</text><text x="60" y="220">Visible workspace only</text><text x="312" y="167">Orchestrator</text><text x="312" y="194">Worker · Reviewer</text><text x="312" y="221">Separate histories</text><text x="570" y="157">Budget + operation limits</text><text x="570" y="185">Workspace tools + isolation</text><text x="570" y="213">Candidate SHA + version</text><text x="859" y="145">Visible observations</text><text x="859" y="237">Independent / private</text></g>
    <text x="570" y="306" fill="#fffdf8" font-size="18" font-weight="700">Functional · Workflow · Evidence · Completion</text>
    <text x="570" y="331" fill="#bfe3df" font-size="15">Saved receipts, resources, terminal and browser reports</text>
    <text x="42" y="338" font-size="15" fill="#526c75">Protected grades stay outside evaluated role messages.</text>
  </g>
</svg>
